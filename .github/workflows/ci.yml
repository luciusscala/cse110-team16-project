name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      # jsdom 30 needs Node >= 22.22, so pin a current LTS
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npx vitest run

      # Uses vite build directly because `npm run build` runs tsc first, which
      # fails on the intentional bad inputs in ProgressManager.test.ts
      - name: Build
        run: npx vite build
