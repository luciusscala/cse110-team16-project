<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <!-- Frizza menu background: a cartoon pizza shop interior.
       The center column (x 220-580, y 95-485) holds a cream order-ticket panel
       that the title and menu buttons are drawn on top of. -->
  <defs>
    <pattern id="wallTile" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#fde8c8"/>
      <path d="M20 8 L28 20 L20 32 L12 20 Z" fill="#f8d9ae"/>
    </pattern>
    <pattern id="brick" width="40" height="20" patternUnits="userSpaceOnUse">
      <rect width="40" height="20" fill="#c65a2e"/>
      <path d="M0 0 H40 M0 10 H40 M1 0 V10 M21 10 V20" stroke="#8f3a1a" stroke-width="2"/>
    </pattern>
    <pattern id="checker" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#fff6e6"/>
      <rect width="20" height="20" fill="#d9412b"/>
      <rect x="20" y="20" width="20" height="20" fill="#d9412b"/>
    </pattern>
    <radialGradient id="fireGlow" cx="0.5" cy="0.8" r="0.7">
      <stop offset="0" stop-color="#ffcf4a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ff7a1a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Back wall -->
  <rect width="800" height="600" fill="url(#wallTile)"/>

  <!-- Brick pizza oven (left) -->
  <rect x="88" y="80" width="44" height="100" fill="url(#brick)" stroke="#4a2511" stroke-width="4"/>
  <path d="M18 495 V300 Q18 168 110 168 Q202 168 202 300 V495 Z"
        fill="url(#brick)" stroke="#4a2511" stroke-width="5"/>
  <path d="M52 435 V345 Q52 285 110 285 Q168 285 168 345 V435 Z"
        fill="#2b1a12" stroke="#4a2511" stroke-width="5"/>
  <ellipse cx="110" cy="410" rx="62" ry="50" fill="url(#fireGlow)"/>
  <path d="M68 432 Q70 395 84 380 Q86 400 96 404 Q96 370 112 352 Q114 385 128 392 Q132 372 146 366 Q154 400 152 432 Z"
        fill="#ff7a1a" stroke="#4a2511" stroke-width="3" stroke-linejoin="round"/>
  <path d="M86 432 Q88 410 98 402 Q102 416 110 418 Q112 398 122 388 Q128 410 136 432 Z" fill="#ffd45c"/>
  <rect x="40" y="432" width="140" height="14" rx="4" fill="#8b5a2b" stroke="#4a2511" stroke-width="3"/>

  <!-- Chalkboard menu (right) -->
  <rect x="606" y="102" width="172" height="172" rx="10" fill="#8b5a2b" stroke="#4a2511" stroke-width="4"/>
  <rect x="618" y="114" width="148" height="148" rx="4" fill="#2f4f3a"/>
  <g font-family="'Chalkboard SE', 'Comic Sans MS', 'Marker Felt', cursive" fill="#fdfaf0">
    <text x="692" y="142" font-size="17" font-weight="bold" text-anchor="middle">TODAY'S SLICES</text>
    <line x1="634" y1="152" x2="750" y2="152" stroke="#fdfaf0" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="634" y="182" font-size="17">1/2 Cheese</text>
    <text x="634" y="210" font-size="17">1/4 Pepperoni</text>
    <text x="634" y="238" font-size="17">3/8 Veggie</text>
  </g>

  <!-- Shelf with ingredients (right) -->
  <rect x="598" y="330" width="190" height="14" rx="3" fill="#a0632e" stroke="#4a2511" stroke-width="3"/>
  <!-- Tomato jar -->
  <rect x="612" y="282" width="44" height="48" rx="8" fill="#fbe3d0" stroke="#4a2511" stroke-width="3"/>
  <rect x="608" y="274" width="52" height="12" rx="4" fill="#d9412b" stroke="#4a2511" stroke-width="3"/>
  <circle cx="626" cy="304" r="9" fill="#d9412b"/>
  <circle cx="643" cy="314" r="9" fill="#e5533a"/>
  <!-- Cheese shaker -->
  <path d="M676 330 V296 Q676 284 688 284 H704 Q716 284 716 296 V330 Z"
        fill="#fff6d6" stroke="#4a2511" stroke-width="3"/>
  <rect x="680" y="266" width="32" height="20" rx="6" fill="#c9ccd1" stroke="#4a2511" stroke-width="3"/>
  <circle cx="688" cy="272" r="2" fill="#4a2511"/><circle cx="696" cy="272" r="2" fill="#4a2511"/><circle cx="704" cy="272" r="2" fill="#4a2511"/>
  <text x="696" y="314" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#c77d1a" text-anchor="middle">PARM</text>
  <!-- Basil pot -->
  <path d="M736 330 L732 300 H772 L768 330 Z" fill="#c65a2e" stroke="#4a2511" stroke-width="3"/>
  <ellipse cx="740" cy="288" rx="9" ry="14" fill="#4caf50" stroke="#2e6b31" stroke-width="2" transform="rotate(-25 740 288)"/>
  <ellipse cx="752" cy="282" rx="9" ry="16" fill="#5cc260" stroke="#2e6b31" stroke-width="2"/>
  <ellipse cx="764" cy="288" rx="9" ry="14" fill="#4caf50" stroke="#2e6b31" stroke-width="2" transform="rotate(25 764 288)"/>

  <!-- Striped awning with scalloped edge -->
  <rect x="0" y="0" width="800" height="62" fill="#fff6e6"/>
  <g fill="#d9412b">
    <rect x="0" width="40" height="62"/><rect x="80" width="40" height="62"/>
    <rect x="160" width="40" height="62"/><rect x="240" width="40" height="62"/>
    <rect x="320" width="40" height="62"/><rect x="400" width="40" height="62"/>
    <rect x="480" width="40" height="62"/><rect x="560" width="40" height="62"/>
    <rect x="640" width="40" height="62"/><rect x="720" width="40" height="62"/>
  </g>
  <g stroke="#4a2511" stroke-width="3">
    <circle cx="20" cy="62" r="20" fill="#d9412b"/><circle cx="60" cy="62" r="20" fill="#fff6e6"/>
    <circle cx="100" cy="62" r="20" fill="#d9412b"/><circle cx="140" cy="62" r="20" fill="#fff6e6"/>
    <circle cx="180" cy="62" r="20" fill="#d9412b"/><circle cx="220" cy="62" r="20" fill="#fff6e6"/>
    <circle cx="260" cy="62" r="20" fill="#d9412b"/><circle cx="300" cy="62" r="20" fill="#fff6e6"/>
    <circle cx="340" cy="62" r="20" fill="#d9412b"/><circle cx="380" cy="62" r="20" fill="#fff6e6"/>
    <circle cx="420" cy="62" r="20" fill="#d9412b"/><circle cx="460" cy="62" r="20" fill="#fff6e6"/>
    <circle cx="500" cy="62" r="20" fill="#d9412b"/><circle cx="540" cy="62" r="20" fill="#fff6e6"/>
    <circle cx="580" cy="62" r="20" fill="#d9412b"/><circle cx="620" cy="62" r="20" fill="#fff6e6"/>
    <circle cx="660" cy="62" r="20" fill="#d9412b"/><circle cx="700" cy="62" r="20" fill="#fff6e6"/>
    <circle cx="740" cy="62" r="20" fill="#d9412b"/><circle cx="780" cy="62" r="20" fill="#fff6e6"/>
  </g>
  <!-- Cover the top halves of the scallops so only the bottom edge shows -->
  <g fill="#d9412b">
    <rect x="0" y="40" width="40" height="22"/><rect x="80" y="40" width="40" height="22"/>
    <rect x="160" y="40" width="40" height="22"/><rect x="240" y="40" width="40" height="22"/>
    <rect x="320" y="40" width="40" height="22"/><rect x="400" y="40" width="40" height="22"/>
    <rect x="480" y="40" width="40" height="22"/><rect x="560" y="40" width="40" height="22"/>
    <rect x="640" y="40" width="40" height="22"/><rect x="720" y="40" width="40" height="22"/>
  </g>
  <g fill="#fff6e6">
    <rect x="40" y="40" width="40" height="22"/><rect x="120" y="40" width="40" height="22"/>
    <rect x="200" y="40" width="40" height="22"/><rect x="280" y="40" width="40" height="22"/>
    <rect x="360" y="40" width="40" height="22"/><rect x="440" y="40" width="40" height="22"/>
    <rect x="520" y="40" width="40" height="22"/><rect x="600" y="40" width="40" height="22"/>
    <rect x="680" y="40" width="40" height="22"/><rect x="760" y="40" width="40" height="22"/>
  </g>

  <!-- Counter -->
  <rect x="-5" y="490" width="810" height="24" fill="#e0a466" stroke="#4a2511" stroke-width="4"/>
  <rect x="-5" y="514" width="810" height="91" fill="#b5653a" stroke="#4a2511" stroke-width="4"/>
  <rect x="0" y="530" width="800" height="20" fill="url(#checker)" stroke="#4a2511" stroke-width="3"/>
  <g stroke="#8f4a25" stroke-width="3">
    <line x1="100" y1="550" x2="100" y2="600"/><line x1="200" y1="550" x2="200" y2="600"/>
    <line x1="300" y1="550" x2="300" y2="600"/><line x1="400" y1="550" x2="400" y2="600"/>
    <line x1="500" y1="550" x2="500" y2="600"/><line x1="600" y1="550" x2="600" y2="600"/>
    <line x1="700" y1="550" x2="700" y2="600"/>
  </g>

  <!-- Pizza boxes stacked on the counter (right) -->
  <g stroke="#4a2511" stroke-width="3">
    <rect x="618" y="464" width="156" height="28" rx="3" fill="#e9c38f"/>
    <rect x="626" y="436" width="140" height="28" rx="3" fill="#f2d3a2"/>
    <rect x="612" y="408" width="152" height="28" rx="3" fill="#e9c38f"/>
  </g>
  <text x="688" y="428" font-family="'Arial Black', Arial, sans-serif" font-size="14" font-weight="bold" fill="#d9412b" text-anchor="middle">FRIZZA</text>

  <!-- Whole pizza cut into 8 slices on a wooden board (left, on the counter) -->
  <ellipse cx="110" cy="474" rx="104" ry="26" fill="#a0632e" stroke="#4a2511" stroke-width="4"/>
  <ellipse cx="110" cy="470" rx="92" ry="21" fill="#e8a54b" stroke="#4a2511" stroke-width="3"/>
  <ellipse cx="110" cy="470" rx="80" ry="17" fill="#d9412b"/>
  <ellipse cx="110" cy="469" rx="74" ry="15" fill="#ffd45c"/>
  <g stroke="#c77d1a" stroke-width="2">
    <line x1="28" y1="470" x2="192" y2="470"/>
    <line x1="110" y1="451" x2="110" y2="489"/>
    <line x1="55" y1="457" x2="165" y2="483"/>
    <line x1="55" y1="483" x2="165" y2="457"/>
  </g>
  <g fill="#b22222">
    <ellipse cx="75" cy="463" rx="8" ry="3.5"/><ellipse cx="135" cy="462" rx="8" ry="3.5"/>
    <ellipse cx="90" cy="479" rx="8" ry="3.5"/><ellipse cx="148" cy="476" rx="8" ry="3.5"/>
    <ellipse cx="110" cy="470" rx="7" ry="3"/>
  </g>

  <!-- Center order-ticket panel behind the title and buttons -->
  <rect x="220" y="95" width="360" height="390" rx="24" fill="#fff8e7" fill-opacity="0.92"
        stroke="#4a2511" stroke-width="5"/>
  <rect x="234" y="109" width="332" height="362" rx="16" fill="none"
        stroke="#d9412b" stroke-width="3" stroke-dasharray="10 8"/>
</svg>
