<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Frizza</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
      }

      /* Center the fixed-size Konva stage in the window */
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #3b2415;
      }

      /* The Konva canvas is transparent; screens without their own
         background art need a light backdrop behind them. */
      #container {
        background: #ffffff;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      }
    </style>
  </head>
  <body>
    <div id="container"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
